[package]
name = "benefit-calculator"
version = "1.1.1"
description = "A Tauri App for Project Benefit Calculation"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["macos-private-api", "protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = "1.34"
tauri-plugin-dialog = "2.7.0"
calamine = "0.34.0"
zip = "8.5.1"
regex = "1.12.3"
chrono = "0.4"
docx-template = "0.2.7"
umya-spreadsheet = "2.3.3"
base64 = "0.22.1"
tauri-plugin-http = "2.5.9"
rusqlite = { version = "0.31.0", features = ["bundled"] }
uuid = { version = "1.8", features = ["v4"] }
tiny_http = { version = "0.12", default-features = false }

# ACP protocol client. Versions here are what `cargo tree` actually resolves:
# `agent-client-protocol 2.0.0` pins `agent-client-protocol-schema` to `=1.5.0`
# (not the 1.7.0 an early survey assumed), and both speak ACP wire version 1.
# `dsh_session.rs` asserts that wire version on every handshake.
#
# tokio is confined to the dsh transport: the rest of lamber's backend stays
# synchronous, and `AcpRuntime` owns the only runtime, on its own thread.
agent-client-protocol = "2.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-std", "io-util"] }

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
